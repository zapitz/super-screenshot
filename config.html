<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Screenshot - Configuración General</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            overflow-y: auto;
            height: 100vh;
        }

        .config-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px 100px 20px;
            min-height: 100vh;
            overflow-y: auto;
        }

        .config-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
        }

        .back-btn {
            background-color: transparent;
            border: 2px solid #424242;
            color: #9e9e9e;
            font-size: 1.2em;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            border-color: #4fc3f7;
            color: #4fc3f7;
        }

        .config-section {
            background-color: #2d2d2d;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .config-section h3 {
            color: #4fc3f7;
            margin-bottom: 20px;
        }

        .config-group {
            margin-bottom: 20px;
        }

        .config-group:last-child {
            margin-bottom: 0;
        }

        .config-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
        }

        .config-group small {
            display: block;
            color: #757575;
            margin-top: 5px;
            font-size: 12px;
        }

        .checkbox-label {
            display: flex !important;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: #e0e0e0 !important;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .folder-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .folder-selector input[type="text"] {
            flex: 1;
            padding: 10px;
            background-color: #1e1e1e;
            border: 1px solid #424242;
            border-radius: 4px;
            color: #9e9e9e;
            font-size: 13px;
        }

        .folder-selector button {
            padding: 10px 15px;
            font-size: 13px;
        }

        .save-btn {
            background-color: #4fc3f7;
            color: #1e1e1e;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            margin: 30px auto;
        }

        .save-btn:hover {
            background-color: #29b6f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 195, 247, 0.4);
        }

        .link-btn {
            width: 100%;
            padding: 15px 20px;
            background-color: #424242;
            color: #e0e0e0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .link-btn:hover {
            background-color: #4fc3f7;
            color: #1e1e1e;
        }

        .section-description {
            color: #9e9e9e;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="config-container">
        <div class="config-header">
            <button id="backBtn" class="back-btn">
                <span>&larr;</span>
                <span>Volver</span>
            </button>
            <h1 style="flex: 1; text-align: center; color: #4fc3f7;">Configuración General</h1>
        </div>

        <!-- PDF Metadata Section -->
        <div class="config-section">
            <h3>&#128196; Metadata del PDF</h3>

            <div class="config-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="useSignerAsAuthor" checked>
                    Incluir firmante como autor del PDF
                </label>
                <small>El nombre del firmante aparecera en las propiedades del documento</small>
            </div>

            <div class="config-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="useCoverDateAsCreation" checked>
                    Usar fecha de portada como fecha de creación
                </label>
                <small>La fecha del reporte se usará como fecha de creación del PDF</small>
            </div>
        </div>

        <!-- Output Folder Section -->
        <div class="config-section">
            <h3>&#128193; Carpeta de Salida</h3>

            <div class="config-group">
                <label>Los archivos se guardaran en:</label>
                <div class="folder-selector">
                    <input type="text" id="outputFolder" readonly placeholder="Carpeta de Descargas (por defecto)">
                    <button id="selectFolderBtn" class="secondary-btn">Cambiar</button>
                    <button id="resetFolderBtn" class="secondary-btn">Restablecer</button>
                </div>
            </div>
        </div>

        <!-- Profile Editor Link Section -->
        <div class="config-section">
            <h3>&#127912; Perfiles de Marca</h3>
            <p class="section-description">Gestiona los perfiles con logos, colores y datos de firmante.</p>
            <button id="goToProfileEditorBtn" class="link-btn">
                Ir al Editor de Perfiles &rarr;
            </button>
        </div>

        <button id="saveBtn" class="save-btn">Guardar Configuración</button>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="config-renderer.js"></script>
</body>
</html>
