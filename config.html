<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Screenshot - Configuración</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            overflow-y: auto;
            height: 100vh;
        }
        
        .config-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px 100px 20px;
            min-height: 100vh;
            overflow-y: auto;
        }

        .config-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
        }

        .back-btn {
            background-color: transparent;
            border: 2px solid #424242;
            color: #9e9e9e;
            font-size: 1.2em;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            border-color: #4fc3f7;
            color: #4fc3f7;
        }

        .config-section {
            background-color: #2d2d2d;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .config-section h3 {
            color: #4fc3f7;
            margin-bottom: 20px;
        }

        .config-group {
            margin-bottom: 20px;
        }

        .config-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: #424242;
            outline: none;
            border-radius: 3px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4fc3f7;
            cursor: pointer;
            border-radius: 50%;
        }

        .slider-value {
            min-width: 50px;
            text-align: center;
            color: #4fc3f7;
            font-weight: bold;
        }

        .save-btn {
            background-color: #4fc3f7;
            color: #1e1e1e;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            margin: 30px auto;
        }

        .save-btn:hover {
            background-color: #29b6f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 195, 247, 0.4);
        }
    </style>
</head>
<body>
    <div class="config-container">
        <div class="config-header">
            <button id="backBtn" class="back-btn">
                <span>←</span>
                <span>Volver</span>
            </button>
            <h1 style="flex: 1; text-align: center; color: #4fc3f7;">Configuración</h1>
        </div>

        <div class="config-section">
            <h3>📄 Configuración del PDF</h3>
            
            <div class="config-group">
                <label for="pdfFontSize">Tamaño de fuente del título</label>
                <div class="slider-container">
                    <input type="range" id="pdfFontSize" class="slider" min="16" max="28" value="20">
                    <span class="slider-value" id="pdfFontSizeValue">20</span>
                </div>
            </div>

            <div class="config-group">
                <label for="pdfMargin">Márgenes del PDF (px)</label>
                <div class="slider-container">
                    <input type="range" id="pdfMargin" class="slider" min="30" max="80" value="50" step="5">
                    <span class="slider-value" id="pdfMarginValue">50</span>
                </div>
            </div>

            <div class="config-group">
                <label for="pdfQuality">Calidad de imagen (%)</label>
                <div class="slider-container">
                    <input type="range" id="pdfQuality" class="slider" min="50" max="100" value="85" step="5">
                    <span class="slider-value" id="pdfQualityValue">85</span>
                </div>
            </div>
            
            
            <div class="config-group">
                <label>
                    <input type="checkbox" id="showPublishDate" checked>
                    Mostrar fecha de publicación en capturas
                </label>
            </div>
        </div>

        <div class="config-section">
            <h3>📄 Página de Portada</h3>
            
            <div class="config-group">
                <label>
                    <input type="checkbox" id="showCoverPage" checked>
                    Mostrar página de portada
                </label>
            </div>
            
            <div class="config-group">
                <label>
                    <input type="checkbox" id="showCoverDate" checked>
                    Mostrar fecha de generación en portada
                </label>
            </div>

            <div class="config-group">
                <label for="logoFile">Logo (PNG o JPG)</label>
                <input type="file" id="logoFile" accept="image/png,image/jpeg,image/jpg" style="display: none;">
                <button id="selectLogoBtn" class="secondary-btn" style="margin-right: 10px;">Seleccionar Logo</button>
                <button id="removeLogoBtn" class="secondary-btn" style="display: none;">Quitar Logo</button>
                <div id="logoPreview" style="margin-top: 10px; text-align: center;"></div>
            </div>

            <div class="config-group">
                <label for="coverTitle">Título de portada</label>
                <input type="text" id="coverTitle" placeholder="Título del reporte" style="width: 100%; padding: 10px; background-color: #1e1e1e; border: 1px solid #424242; border-radius: 4px; color: #e0e0e0; font-size: 16px;">
            </div>
            
            <div class="config-group">
                <label for="coverDescription">Descripción de portada</label>
                <textarea id="coverDescription" rows="3" placeholder="Descripción del reporte" style="width: 100%; padding: 10px; background-color: #1e1e1e; border: 1px solid #424242; border-radius: 4px; color: #e0e0e0; font-size: 14px; resize: vertical;"></textarea>
            </div>
        </div>

        <div class="config-section">
            <h3>📸 Configuración de captura</h3>
            
            <div class="config-group">
                <label for="screenshotDelay">Retraso adicional después de carga (ms)</label>
                <div class="slider-container">
                    <input type="range" id="screenshotDelay" class="slider" min="0" max="5000" value="1000" step="100">
                    <span class="slider-value" id="screenshotDelayValue">1000</span>
                </div>
            </div>

            <div class="config-group">
                <label>
                    <input type="checkbox" id="waitForImages" checked>
                    Esperar a que carguen todas las imágenes
                </label>
            </div>

            <div class="config-group">
                <label>
                    <input type="checkbox" id="blockAds">
                    Bloquear anuncios (experimental)
                </label>
            </div>
        </div>

        <button id="saveBtn" class="save-btn">Guardar Configuración</button>
    </div>

    <script src="config-renderer.js"></script>
</body>
</html>
